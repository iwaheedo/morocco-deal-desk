name: Analyse a property
run-name: "Analyse: ${{ inputs.url }}"

# Started by hand only (Actions -> Run workflow), which GitHub allows only for people with write access.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Mubawab listing link (https://www.mubawab.ma/fr/a/…)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install the spreadsheet library
        run: pip install --quiet openpyxl
      - name: Install LibreOffice (used to re-check the sums; the analysis runs without it if this fails)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq --no-install-recommends libreoffice-calc > /dev/null
      - name: Analyse the listing
        env:
          LISTING_URL: ${{ inputs.url }}
          TZ: Europe/London
        run: python app/run_once.py
      - name: Keep the spreadsheet
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: morocco-property-tracker
          path: "Morocco Property Tracker.xlsx"
          if-no-files-found: ignore
      - name: Save the result to the repository
        if: always()
        run: |
          git config user.name "deal-desk"
          git config user.email "deal-desk@users.noreply.github.com"
          git add -A properties runs results
          git diff --cached --quiet || git commit -m "Run: ${RUN_TITLE:-analysis}"
          git pull --rebase -X theirs
          git push
